<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DetailGen - 상세페이지 자동 생성기</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ========== 입력 화면 ========== -->
  <div id="app-input" class="app-screen">
    <header class="app-header">
      <div class="header-inner">
        <h1 class="logo">Detail<span>Gen</span></h1>
        <p class="tagline">JSON 기획서를 붙여넣으면 상세페이지가 자동 생성됩니다</p>
      </div>
    </header>

    <main class="form-container">
      <!-- JSON 입력 -->
      <section class="form-section json-section">
        <div class="section-header">
          <span class="section-number">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15h6"/></svg>
          </span>
          <h2>기획서 JSON 붙여넣기</h2>
        </div>
        <div class="json-input-wrapper">
          <textarea id="jsonInput" class="json-textarea" placeholder='{
  "product": { "brand": "...", "name": "...", "type": "..." },
  "sections": [ ... ],
  "visualDirection": { ... }
}'></textarea>
          <div id="jsonStatus" class="json-status"></div>
        </div>
      </section>

      <!-- 옵션 -->
      <section class="form-section">
        <div class="section-header">
          <span class="section-number">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          </span>
          <h2>출력 옵션</h2>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label for="pageWidth">페이지 폭</label>
            <select id="pageWidth">
              <option value="780" selected>780px (스마트스토어)</option>
              <option value="860">860px (쿠팡)</option>
              <option value="1000">1000px (자사몰)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="imageGuideLevel">이미지 가이드 상세도</label>
            <select id="imageGuideLevel">
              <option value="full" selected>전체 표시 (촬영 가이드 포함)</option>
              <option value="summary">요약만 표시</option>
              <option value="minimal">이미지 영역만 표시</option>
            </select>
          </div>
        </div>
      </section>

      <!-- 생성 버튼 -->
      <div class="form-actions">
        <button type="button" class="btn-generate" onclick="generateFromJSON()">
          상세페이지 생성하기
        </button>
        <button type="button" class="btn-demo" onclick="loadQuickBaitDemo()">
          퀵베이트 데모 불러오기
        </button>
      </div>
    </main>
  </div>

  <!-- ========== 결과 화면 ========== -->
  <div id="app-result" class="app-screen" style="display:none;">
    <div class="result-toolbar">
      <button class="toolbar-btn" onclick="goBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        돌아가기
      </button>
      <div class="toolbar-title" id="resultTitle">미리보기</div>
      <div class="toolbar-actions">
        <button class="toolbar-btn" onclick="exportHTML()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          HTML 저장
        </button>
        <button class="toolbar-btn" onclick="exportImageList()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          촬영 가이드 저장
        </button>
        <button class="toolbar-btn" onclick="window.print()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>
          인쇄 / PDF
        </button>
      </div>
    </div>
    <div class="result-wrapper">
      <div id="generated-page" class="generated-page"></div>
    </div>
  </div>

  <script src="js/templates.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
