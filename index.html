<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DetailGen - 상세페이지 자동 생성기</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ========== 입력 화면 ========== -->
  <div id="app-input" class="app-screen">
    <header class="app-header">
      <div class="header-inner">
        <h1 class="logo">Detail<span>Gen</span></h1>
        <p class="tagline">기획서 JSON → 상세페이지 컷 미리보기 자동 생성</p>
      </div>
    </header>

    <main class="form-container">
      <!-- JSON 입력 -->
      <section class="form-section json-section">
        <div class="section-header">
          <span class="section-number">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15h6"/></svg>
          </span>
          <h2>기획서 JSON 붙여넣기</h2>
        </div>
        <div class="json-input-wrapper">
          <textarea id="jsonInput" class="json-textarea" spellcheck="false" placeholder='기획서 JSON을 여기에 붙여넣으세요.

{
  "product": { ... },
  "sections": [ ... ],
  "visualDirection": { ... },
  "copyRules": { ... }
}'></textarea>
          <div id="jsonStatus" class="json-status"></div>
        </div>
      </section>

      <!-- 출력 옵션 -->
      <section class="form-section">
        <div class="section-header">
          <span class="section-number">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          </span>
          <h2>출력 옵션</h2>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label for="pageWidth">페이지 폭</label>
            <select id="pageWidth">
              <option value="780" selected>780px (스마트스토어)</option>
              <option value="860">860px (쿠팡)</option>
              <option value="1000">1000px (자사몰)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="viewMode">보기 모드</label>
            <select id="viewMode">
              <option value="preview" selected>컷 미리보기</option>
              <option value="designer">디자이너 핸드오프</option>
              <option value="mobile">모바일 시뮬레이션</option>
            </select>
          </div>
        </div>
      </section>

      <!-- 생성 버튼 -->
      <div class="form-actions">
        <button type="button" class="btn-generate" onclick="generateFromJSON()">
          상세페이지 생성하기
        </button>
        <button type="button" class="btn-demo" onclick="loadQuickBaitDemo()">
          퀵베이트 데모
        </button>
      </div>
    </main>
  </div>

  <!-- ========== 결과 화면 ========== -->
  <div id="app-result" class="app-screen" style="display:none;">
    <div class="result-toolbar">
      <button class="toolbar-btn" onclick="goBack()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        돌아가기
      </button>
      <div class="toolbar-center">
        <span class="toolbar-title" id="resultTitle">미리보기</span>
        <div class="toolbar-modes">
          <button class="mode-btn active" data-mode="preview" onclick="switchMode('preview')">컷 미리보기</button>
          <button class="mode-btn" data-mode="designer" onclick="switchMode('designer')">디자이너</button>
          <button class="mode-btn" data-mode="mobile" onclick="switchMode('mobile')">모바일</button>
        </div>
      </div>
      <div class="toolbar-actions">
        <button class="toolbar-btn" onclick="toggleValidation()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          카피 검증
        </button>
        <div class="export-dropdown">
          <button class="toolbar-btn" onclick="toggleExportMenu()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            내보내기
          </button>
          <div class="export-menu" id="exportMenu">
            <button onclick="exportHTML()">HTML 상세페이지</button>
            <button onclick="exportDesignerDoc()">디자이너 전달용</button>
            <button onclick="exportPhotoGuide()">촬영 가이드</button>
            <button onclick="exportAIPrompts()">AI 프롬프트 시트</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 카피 검증 패널 -->
    <div class="validation-panel" id="validationPanel" style="display:none;">
      <div class="validation-header">
        <h3>카피 검증 결과</h3>
        <button onclick="toggleValidation()" class="validation-close">&times;</button>
      </div>
      <div class="validation-body" id="validationBody"></div>
    </div>

    <!-- 결과 영역 -->
    <div class="result-wrapper" id="resultWrapper">
      <div id="generated-page" class="generated-page"></div>
    </div>
  </div>

  <script src="js/templates.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
